<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Job Application Tracker</h1>
    <p>Keep track of every role you apply for</p>
</header>

<main>
    <!-- Add / Edit form -->
    <section class="card">
        <h2 id="form-title">Add application</h2>

        <form id="app-form">
            <input type="hidden" id="app-id">

            <div class="grid">
                <label>Company *
                    <input type="text" id="company" placeholder="e.g. BAE Systems">
                </label>

                <label>Role *
                    <input type="text" id="role" placeholder="e.g. Junior Java Developer">
                </label>

                <label>Location
                    <input type="text" id="location" placeholder="e.g. London">
                </label>

                <label>Status
                    <select id="status">
                        <option value="APPLIED">Applied</option>
                        <option value="INTERVIEW">Interview</option>
                        <option value="OFFER">Offer</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </label>

                <label>Applied date
                    <input type="date" id="appliedDate">
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="requiresClearance">
                    Requires security clearance
                </label>
            </div>

            <label>Notes
                <textarea id="notes" rows="2" placeholder="Anything to remember..."></textarea>
            </label>

            <div id="form-error" class="error"></div>

            <div class="actions">
                <button type="submit" id="submit-btn">Add application</button>
                <button type="button" id="cancel-btn" class="secondary hidden">Cancel edit</button>
            </div>
        </form>
    </section>

    <!-- List of applications -->
    <section class="card">
        <div class="list-header">
            <h2>My applications <span id="count"></span></h2>
            <select id="filter">
                <option value="">All statuses</option>
                <option value="APPLIED">Applied</option>
                <option value="INTERVIEW">Interview</option>
                <option value="OFFER">Offer</option>
                <option value="REJECTED">Rejected</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Role</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Applied</th>
                    <th>Clearance</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="app-table"></tbody>
        </table>

        <p id="empty" class="empty hidden">No applications yet. Add your first one above.</p>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
